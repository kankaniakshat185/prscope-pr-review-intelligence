name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r requirements.txt

      - run: pytest -v
        env:
          JWT_SECRET: ci-test-secret-not-for-production
          ENABLE_MOCK_AUTH: "true"

  extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: extension/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build (Chrome extension bundle)
        run: npm run build

      # Not blocking yet: page.tsx has been componentized and typed (the
      # ~30 no-explicit-any findings that motivated this are gone), but a
      # handful of pre-existing findings remain unrelated to that work -
      # postbuild.js's CommonJS require()s, a couple of unused vars in
      # content.js/layout.tsx, and react-hooks/set-state-in-effect on the
      # localStorage-hydration-on-mount pattern (used deliberately in a few
      # places; fixing it "properly" means lazy useState initializers with
      # SSR guards, a separate piece of work). Flip to blocking once those
      # are cleared.
      - name: Lint (informational - see comment above for what's left)
        run: npm run lint
        continue-on-error: true
